name: Redraw profile

on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours, so the sky keeps up with Istanbul
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, data/github.json]

permissions:
  contents: write

concurrency:
  group: redraw

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw sky and stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_profile.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist data/cache.json
          git diff --staged --quiet && exit 0
          git commit -m "Redraw profile"
          git pull --rebase -q && git push
